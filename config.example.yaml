# Example configuration for the OAI-Adversarial Plugin (plugin id: timezone-override).
# Copy the block below into your CPA config.yaml under `plugins.configs`.
#
# Notes:
# - Only *.enabled* and the plugin id are required to load the plugin.
# - Every listed field is hot-reloaded: edit the file and CPA reconfigures the
#   plugin without restarting the container.
# - All secrets (proxy URLs) should live in the dedicated proxies file below,
#   not in config.yaml.

plugins:
  enabled: true
  dir: "/CLIProxyAPI/logs/.plugins"
  configs:
    # ---- plugin id (must match the installed .so file name) -----------------
    timezone-override:
      enabled: true
      priority: 100

      # Target IANA timezone written into <environment_context> blocks. Must
      # be a valid zone name (validated with time.LoadLocation); invalid
      # values reject the whole config update. Defaults to
      # America/Los_Angeles when omitted. Match it to the egress IP's
      # geolocation, e.g. Asia/Singapore for a Singapore VPS.
      # Dashboard timezone overrides are persisted in runtime-settings.json.
      # Display and sleep schedule remain UTC+8.
      # timezone: "America/Los_Angeles"
      # Empirical acceptance policy; replace for your accounts, not by plan name.
      # Also supported as turn-state-override.accepted-state-lengths.
      # accepted-state-lengths: [292, 332]

      # ---- request-side X-Codex-Turn-State rewrite --------------------------
      turn-state-override:
        # Master switch: when enabled, matching requests get the header value
        # replaced before reaching the upstream.
        enabled: true

        # Model prefixes to rewrite (case-insensitive prefix match).
        models:
          - gpt-6-astra

        # Legacy global values have no account provenance and are never used
        # as a fallback for account-bound requests. Do not put tickets here.
        value: ""

        # Compatibility setting. Account-bound requests always use their own
        # baseline, or clear the unbound client ticket when none is available.
        force: true

        # ---- account/session provenance guard ------------------------------
        # observe: record same/foreign/unknown ownership without changing the
        #          outbound header (recommended first rollout stage)
        # enforce: a state known to belong to another AuthID/model is removed;
        #          it is replaced only when the selected AuthID has its own
        #          unexpired healthy state
        # off:     legacy request-side adoption behavior
        # Unknown client states may pass in observe/enforce mode, but they do
        # not seed an account pool until a successful matching upstream
        # response confirms ownership.
        session-guard-mode: observe

        # Short-lived in-memory ownership mapping. Only a SHA-256 fingerprint
        # and account/model metadata are retained; no token body is duplicated.
        session-provenance-ttl-minutes: 60

        # ---- probe track (manual mode) --------------------------------------
        probe:
          enabled: true

          # Opt in to all eligible host credentials: N accounts x M checked
          # models x 2 independent slots, sharing one serial worker.
          # Default fixed requires an exact host auth-file path binding.
          # account-mode: "all-accounts"

          # Probe priority order for manual rounds: models are tried in this
          # order, once each, until the round is stopped or the list ends.
          # luna/terra families remain visible as "not checked" but never
          # probe, reject for degradation, inject or backfill turn-state.
          # Exemption follows the original requested model, not a response
          # model: astra/sol routed to luna are still checked.
          models:
            - gpt-6-astra
            - gpt-5.6-sol
            - gpt-5.6-luna
            - gpt-5.6-terra

          # Credential file with access_token/account_id (auth JSON as produced
          # by CPA's OAuth flow). Keep it outside the repository.
          cred-file: "/root/.cli-proxy-api/your-codex-auth.json"

          # Dedicated secrets file with one egress per line:
          #   direct
          #   socks5://user:pass@host:port
          #   http://user:pass@host:port
          # Rotated in order; each egress is retried attempts-per-proxy times
          # before the next one is used.
          proxies-file: "/CLIProxyAPI/logs/.plugins/proxies.conf"

          # Baseline serving TTL (embedded in the token). Values older than
          # this stop being served until a fresh one arrives.
          ttl-minutes: 55

          # Retry policy for one manual round per model: plain egresses get N
          # attempts each, then rotate; rotating pools (# pool:) contribute
          # their own pool-attempts budget instead (see below). The automatic
          # round cap = (plain count x N) + (pools x pool-attempts). Success
          # stores the baseline; failure only annotates the dashboard
          # (cool-down hint). The independent prefetch watcher can enqueue
          # another attempt when its window and throttle allow it.
          probe-interval-seconds: 5
          attempts-per-proxy: 3
          # max-attempts-per-round: 0   # 0/absent = auto (see formula above)
          cooldown-minutes: 20
          # ---- egress pool rotation (IPv4/IPv6 mixed friendly) -----------
          # Two temporary removals apply to plain (fixed-endpoint) egresses,
          # both released automatically once their window passes:
          #   - a scheduled rest after a healthy capture
          #     (exit-success-cooldown-minutes, default 30): the rotation
          #     spreads attempts across other exits instead of hammering the
          #     same address; set 0 for the legacy "success = usable
          #     immediately" behaviour;
          #   - a failure cool-down: a streak of consecutive failed attempts
          #     (length anomaly, model mismatch or transport errors) reaching
          #     exit-fail-threshold removes the exit for
          #     exit-cooldown-minutes (set 0 to disable the removal).
          # IPv6 exits can be added to the proxies file as
          # socks5h://[2001:db8::1]:1080 or http://[2001:db8::1]:8080
          # and are pooled with IPv4 exits.
          exit-fail-threshold: 3
          exit-cooldown-minutes: 180
          exit-success-cooldown-minutes: 30
          # Rotating pools (one endpoint that presents many source IPs, for
          # example a local IPv6/64 dynamic proxy) are NEVER benched: every
          # connection draws a fresh address, so a failing streak says
          # nothing about the endpoint being broken. Their failures keep
          # accumulating for the dashboard, but no cool-down is applied.
          # Mark such an entry with a trailing comment in the proxies file:
          #   socks5h://192.0.2.1:1080  # pool:ipv6 (documentation address)
          # Rotating pools also get an independent per-round budget below:
          # every attempt draws a fresh random source address, so one round
          # may sample up to pool-attempts times (default 100) to find a
          # healthy 292-byte state - far more lottery tickets than a fixed
          # endpoint deserves, and success still stops the round early.
          pool-attempts: 100
          # exit-pool-fail-threshold is kept for backward compatibility only;
          # it no longer participates in the cool-down decision.
          exit-pool-fail-threshold: 10
          # Minimum usable exits kept in rotation (soonest-expiring entries
          # are released early when the usable set would fall below this).
          exit-min-active: 1
          # ---- successor hand-off (smooth takeover) -------------------------
          # One healthy capture is enough: away from expiry nothing probes.
          # The watcher probes a model only while its active token's
          # remaining validity enters this window; the successor token
          # takes over on lookup after the active expires, if still valid.
          # Queue delays and upstream failures can prevent timely capture.
          # Stop-current cancels this batch and preserves prefetch mode;
          # stop-all (legacy stop-round) also halts prefetch across restarts.
          # Start-round re-arms it. Set 0 for fully manual operation.
          # Probe failures do not reject business while a healthy active
          # or successor remains available. Actual business evidence is
          # evaluated independently by the rejection switch below.
          prefetch-minutes: 3
          # The dashboard can persist overrides in runtime-settings.json
          # beside state.json. Confirmed dashboard values take precedence.
          # 0 disables future automatic prefetch; it does not cancel queued
          # work or change the full-stop/paused modes. Keep below ttl-minutes.
          # The serial queue interval (seconds, 1..3600) can likewise be
          # saved from the dashboard; a change applies from the next wait
          # and the worker is never re-armed by saving.
          # Proxy entries can also be added/edited on the pool page. Each
          # entry may override its base attempt count and multiply it by
          # 0.01..100 (rounded up); an explicit round cap still wins.
          # Degraded-model rejection is ON by default and restored from the
          # state snapshot across reloads; toggle it from the dashboard
          # header (global switch, independent of the probe track).
          # suspect-threshold: in-round degradation-evidence failures needed
          # before the rejection switch treats the model as degraded (early
          # trigger; the full annotation still wins once the round completes).
          suspect-threshold: 3

          # Upstream request settings for each probe.
          timeout-seconds: 60
          prompt: "hi"
          upstream-url: "https://chatgpt.com/backend-api/codex/responses"

        # ---- deployment seeds (optional) ------------------------------------
        # The plugin seeds missing baselines from, in order:
        #   1. /CLIProxyAPI/logs/.plugins/timezone-override/seeds.json
        #      (map of model -> last known-good 292-byte value; produced by
        #      the open-source-prep scanner from server records/backups)
        #   2. the newest healthy values in its own audit journal
        # A value is only ever drafted when it is exactly 292 bytes and its
        # embedded timestamp decodes; existing baselines are never overwritten.
